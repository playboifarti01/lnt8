<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mobile Timer</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        margin: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #111;
        color: white;
      }

      .timer-container {
        width: 90%;
        max-width: 500px;

        background: #222;

        padding: 30px;

        border-radius: 20px;

        text-align: center;
      }

      h1 {
        font-size: 32px;
      }

      .inputs {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .inputs input {
        width: 30%;

        padding: 15px;

        font-size: 22px;

        text-align: center;

        border-radius: 10px;

        border: none;
      }

      #timer {
        font-size: clamp(45px, 15vw, 80px);

        margin: 35px 0;

        font-weight: bold;

        padding-top: 10vw;

        padding-bottom: 10vw;
      }

      button {
        width: 30%;

        padding: 15px 10px;

        margin: 5px;

        border: none;

        border-radius: 12px;

        font-size: 18px;

        cursor: pointer;
      }

      #startBtn {
        background: #4caf50;

        color: white;
      }

      #pauseBtn {
        background: #ff9800;

        color: white;
      }

      #resetBtn {
        background: #f44336;

        color: white;
      }

      button:active {
        transform: scale(0.95);
      }

      @media (max-width: 500px) {
        .timer-container {
          padding: 20px;
        }

        button {
          width: 100%;

          margin-top: 10px;
        }

        .inputs input {
          width: 33%;
        }
      }
    </style>
  </head>

  <body>
    <div class="timer-container">
      <h1>Timer</h1>

      <div class="inputs">
        <input id="hoursInput" type="tel" placeholder="HH" />

        <input id="minutesInput" type="tel" placeholder="MM" />

        <input id="secondsInput" type="tel" placeholder="SS" />
      </div>

      <div id="timer">00:00:00</div>

      <button id="startBtn">Start</button>

      <button id="pauseBtn">Pause</button>

      <button id="resetBtn">Reset</button>
    </div>

    <script>
      const timerDisplay = document.getElementById("timer");

      const hoursInput = document.getElementById("hoursInput");
      const minutesInput = document.getElementById("minutesInput");
      const secondsInput = document.getElementById("secondsInput");

      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const resetBtn = document.getElementById("resetBtn");

      let time = 0;
      let interval = null;
      let running = false;

      function formatTime() {
        let hours = Math.floor(time / 3600);

        let minutes = Math.floor((time % 3600) / 60);

        let seconds = time % 60;

        timerDisplay.textContent =
          String(hours).padStart(2, "0") +
          ":" +
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0");
      }

      function preview() {
        if (!running) {
          let h = Number(hoursInput.value) || 0;

          let m = Number(minutesInput.value) || 0;

          let s = Number(secondsInput.value) || 0;

          if (m > 59) {
            m = 59;

            minutesInput.value = 59;
          }

          if (s > 59) {
            s = 59;

            secondsInput.value = 59;
          }

          timerDisplay.textContent =
            String(h).padStart(2, "0") +
            ":" +
            String(m).padStart(2, "0") +
            ":" +
            String(s).padStart(2, "0");
        }
      }

      hoursInput.oninput = preview;
      minutesInput.oninput = preview;
      secondsInput.oninput = preview;

      startBtn.onclick = () => {
        if (running) return;

        if (time === 0) {
          let h = Number(hoursInput.value) || 0;

          let m = Number(minutesInput.value) || 0;

          let s = Number(secondsInput.value) || 0;

          time = h * 3600 + m * 60 + s;
        }

        if (time <= 0) return;

        running = true;

        interval = setInterval(() => {
          time--;

          formatTime();

          if (time <= 0) {
            clearInterval(interval);

            running = false;

            alert("Time's up!");
          }
        }, 1000);
      };

      pauseBtn.onclick = () => {
        clearInterval(interval);

        running = false;
      };

      resetBtn.onclick = () => {
        clearInterval(interval);

        running = false;

        time = 0;

        hoursInput.value = "";

        minutesInput.value = "";

        secondsInput.value = "";

        formatTime();
      };

      formatTime();
    </script>
  </body>
</html>
